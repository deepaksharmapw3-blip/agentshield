# AgentShield Configuration
# All rules are applied in order; first match wins.

version: "1"

# ─── Risk Thresholds ───────────────────────────────────────────────────────────
risk:
  # Score 0–100. Actions scoring >= block_threshold are blocked outright.
  block_threshold: 80
  # Actions scoring >= review_threshold require human approval.
  review_threshold: 50
  # Actions scoring below review_threshold are auto-approved.

# ─── Tool Rules ────────────────────────────────────────────────────────────────
tools:
  # Each entry matches a tool by name (supports glob patterns).
  - name: "fs_write"
    risk_score: 40
    description: "Writing files is medium risk"

  - name: "str_replace"
    risk_score: 35
    description: "Replacing content in files"

  - name: "delete_file"
    risk_score: 85
    description: "File deletion is high risk — require approval"
    require_approval: true

  - name: "execute_command"
    risk_score: 75
    description: "Shell command execution is high risk"
    require_approval: true

  - name: "execute_pwsh"
    risk_score: 90
    description: "Shell command execution is very high risk"
    require_approval: true

  - name: "execute_bash"
    risk_score: 90
    description: "Shell command execution is very high risk"
    require_approval: true

  - name: "exec_*"
    risk_score: 75
    description: "Execution tool patterns require approval"
    require_approval: true

  - name: "web_fetch"
    risk_score: 55
    description: "Fetching external URLs"
    require_approval: false

  - name: "remote_web_search"
    risk_score: 20
    description: "Read-only web search"

  - name: "read_file"
    risk_score: 10
    description: "Reading files is low risk"

  - name: "*"
    risk_score: 30
    description: "Default rule for unmatched tools"

# ─── Secrets Protection ────────────────────────────────────────────────────────
secrets:
  enabled: true
  # Patterns are matched against tool call arguments (as serialized JSON).
  # Matching args are redacted in logs and blocked from external calls.
  patterns:
    - name: "aws Access Key"
      regex: "AKIA[0-9A-Z]{16}"
    - name: "aws Secret Key"
      regex: "aws.{0,20}secret.{0,20}['\"][0-9a-zA-Z/+]{40}['\"]"
    - name: "Generic API Key"
      regex: "(api[_-]?key|apikey)['\"]?\\s*[:=]\\s*['\"]?[0-9a-zA-Z\\-_]{20,}"
    - name: "Private Key Block"
      regex: "-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----"
    - name: "JWT Token"
      regex: "eyJ[A-Za-z0-9_-]+\\.eyJ[A-Za-z0-9_-]+\\.[A-Za-z0-9_-]+"
    - name: "GitHub Token"
      regex: "ghp_[A-Za-z0-9]{36}|github_pat_[A-Za-z0-9_]{82}"
    - name: "Slack Token"
      regex: "xox[baprs]-[0-9A-Za-z\\-]+"
    - name: "Password Field"
      regex: "(password|passwd|pwd)['\"]?\\s*[:=]\\s*['\"][^'\"]{6,}"
    - name: "Connection String"
      regex: "(mongodb|postgres|mysql|redis):\\/\\/[^\\s]+"



# ─── Blocked Patterns ─────────────────────────────────────────────────────────
# These regex patterns in tool arguments trigger an immediate BLOCK.
blocked_patterns:
  - name: "Recursive delete variants"
    regex: 'rm\s+(-[rf]+|--recursive|--force|--r|--f|(-r\s+-f)|(-f\s+-r))|Remove-Item\s+(-Recurse|-Force|(-Recurse\s+-Force)|(-Force\s+-Recurse))'
    reason: "Recursive force delete is not allowed"

  - name: "Fork bomb"
    regex: ':\\(\\)\\s*\\{\\s*:\\|:&'
    reason: "Fork bomb pattern detected"

  - name: "sudo escalation"
    regex: '\\bsudo\\b'
    reason: "Privilege escalation via sudo is blocked"

  - name: "sudo and su escalation"
    regex: '\b(sudo|su\s+-|doas)\b'
    reason: "Privilege escalation (sudo, su -, doas) is blocked"

  - name: "Encoded to shell"
    regex: '(base64|xxd|od).+\|.*(bash|sh|zsh|powershell)'
    reason: "Base64/encoding to shell execution is blocked"

  - name: "Data exfiltration"
    regex: '(cat|grep|head|tail|aws\s+s3).+\|.*(curl|wget|nc|socat)'
    reason: "Piping sensitive data to external commands is blocked"

# ─── Allowed Domains (for web tools) ──────────────────────────────────────────
allowed_domains:
  enabled: false   # set to true to enforce allowlist
  list:
    - "github.com"
    - "npmjs.com"
    - "docs.python.org"
    - "developer.mozilla.org"

# ─── Audit ────────────────────────────────────────────────────────────────────
audit:
  enabled: true
  # Keep records for N days (0 = keep forever)
  retention_days: 90
