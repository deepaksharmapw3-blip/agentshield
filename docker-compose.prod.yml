# AgentShield Production Docker Compose
# Complete stack: Nginx, Backend, LLM Service, Ollama, Prometheus, Grafana

services:
  # Nginx API Gateway / Reverse Proxy
  nginx:
    build:
      context: .
      dockerfile: nginx/Dockerfile
    container_name: agentshield-nginx
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./nginx/ssl:/etc/nginx/ssl
      - ./nginx/.htpasswd:/etc/nginx/.htpasswd:ro
      - nginx-cache:/var/cache/nginx
      - nginx-logs:/var/log/nginx
    environment:
      - TZ=UTC
    depends_on:
      - backend-1
    networks:
      - agentshield
    restart: unless-stopped
    healthcheck:
      test:
        - CMD-SHELL
        - "curl --insecure --silent --output /dev/null --write-out '%{http_code}' https://localhost/health | grep -Eq '^(200|503)$'"
      interval: 30s
      timeout: 10s
      retries: 3

  # Single backend instance: the current runtime uses a local SQLite database.
  backend-1:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: agentshield-backend-1
    ports:
      - "127.0.0.1:${BACKEND_PORT:-3002}:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOST=0.0.0.0
      - DB_PATH=/app/data/agentshield.db
      - LLM_API_URL=http://llm-api:8000
      - APPROVAL_MODE=auto
      - ENABLE_LLM=true
      - LOG_LEVEL=info
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-https://agentshield.local}
      - JWT_ACCESS_SECRET=${JWT_ACCESS_SECRET}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET}
      - INITIAL_ADMIN_USERNAME=${INITIAL_ADMIN_USERNAME}
      - INITIAL_ADMIN_PASSWORD=${INITIAL_ADMIN_PASSWORD}
    volumes:
      - ./backend/logs:/app/logs
      - ./backend/agentshield.config.yaml:/app/agentshield.config.yaml
      - backend-data:/app/data
    depends_on:
      llm-api:
        condition: service_healthy
    networks:
      - agentshield
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "require('http').get('http://127.0.0.1:3000/health', r => { if (r.statusCode !== 200 && r.statusCode !== 503) process.exit(1); r.resume(); }).on('error', () => process.exit(1))"
      interval: 30s
      timeout: 10s
      retries: 3

  # Ollama LLM Runtime (internal only, no port exposure)
  ollama:
    image: ollama/ollama:latest
    container_name: agentshield-ollama
    volumes:
      - ollama-data:/root/.ollama
    environment:
      - OLLAMA_MODELS=/root/.ollama/models
      - TZ=UTC
    networks:
      - agentshield
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 30s
      timeout: 10s
      retries: 3

  # FastAPI LLM Service
  llm-api:
    build:
      context: .
      dockerfile: llm/Dockerfile
    container_name: agentshield-llm-api
    environment:
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://ollama:11434}
      - OLLAMA_MODEL=qwen2.5:7b
      - OLLAMA_TIMEOUT=60
      - LLM_TEMPERATURE=0
      - LLM_API_HOST=0.0.0.0
      - LLM_API_PORT=8000
      - LOG_LEVEL=info
    depends_on:
      ollama:
        condition: service_healthy
    volumes:
      - ./llm/logs:/app/logs
    networks:
      - agentshield
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      start_period: 15s
      retries: 3

  # Prometheus Monitoring
  prometheus:
    image: prom/prometheus:latest
    container_name: agentshield-prometheus
    ports:
      - "${PROMETHEUS_PORT:-9091}:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=30d"
    networks:
      - agentshield
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Grafana Dashboards
  grafana:
    image: grafana/grafana:latest
    container_name: agentshield-grafana
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD}
      - GF_INSTALL_PLUGINS=grafana-piechart-panel
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - agentshield
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  ollama-data:
  nginx-cache:
  nginx-logs:
  prometheus-data:
  grafana-data:
  backend-data:
    name: agentshield-backend-data

networks:
  agentshield:
    driver: bridge
